<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoExplorer - World Map & City Discoveries</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" crossorigin="anonymous">
  <style>
    :root { --bg:#121824; --card:rgba(26,34,52,.95); --accent:#3b82f6; --muted:#9ca3af; --border:#2d3748 }
    * { box-sizing:border-box; margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif }
    body { height:100vh; overflow:hidden; background:var(--bg); color:#f3f4f6 }
    #map { width:100vw; height:100vh }
    .controls { position:absolute; z-index:1000; top:15px; left:50%; transform:translateX(-50%); display:flex; gap:10px; width:90%; max-width:600px }
    .search { display:flex; flex:1; padding:5px 15px; border:1px solid var(--border); border-radius:30px; background:var(--card); box-shadow:0 4px 20px #0005 }
    input { width:100%; padding:10px; border:0; outline:0; background:transparent; color:white; font-size:1rem }
    button { border:0; background:var(--accent); color:white; cursor:pointer; border-radius:10px; padding:0 15px; font-size:1rem }
    .search button { width:42px; height:42px; padding:0; border-radius:50% }
    .status { position:absolute; z-index:1000; bottom:25px; left:20px; padding:10px 15px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--muted) }
    .card { display:none; position:absolute; z-index:1000; right:20px; bottom:20px; width:380px; max-width:calc(100vw - 40px); max-height:80vh; overflow:auto; padding:20px; border:1px solid var(--border); border-radius:16px; background:var(--card); box-shadow:0 10px 30px #0008 }
    .card.active { display:block }
    .close { float:right; background:transparent; color:var(--muted); padding:0; font-size:1.3rem }
    h2 { margin-bottom:2px } .country { color:var(--accent); text-transform:uppercase; letter-spacing:1px; font-size:.9rem; margin-bottom:12px }
    .muted { color:var(--muted); margin:8px 0 } ul { padding-left:20px; color:var(--muted); line-height:1.5 }
    @media (max-width:600px) { .card { left:20px; right:20px; width:auto } }
  </style>
</head>
<body>
  <div class="controls"><div class="search"><input id="searchInput" placeholder="Search for any city..."><button id="searchButton" title="Search">🔍</button></div><button id="randomButton" title="Discover a random city">🎲</button></div>
  <div id="map" aria-label="Interactive world map"></div>
  <div id="status" class="status">Loading world cities… 🌍</div>
  <aside id="card" class="card"><button id="closeButton" class="close">✕</button><h2 id="cityName"></h2><div id="cityCountry" class="country"></div><div id="cityCoordinates" class="muted"></div><div id="cityPopulation" class="muted"></div><ul id="facts"></ul></aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js" crossorigin="anonymous"></script>
  <script>
    (() => {
      'use strict';
      const featured = [
        ['Tokyo','Japan',35.6762,139.6503], ['Rome','Italy',41.9028,12.4964],
        ['Paris','France',48.8566,2.3522], ['London','United Kingdom',51.5074,-0.1278],
        ['New York','United States',40.7128,-74.006], ['Sydney','Australia',-33.8688,151.2093],
        ['Cairo','Egypt',30.0444,31.2357], ['Mumbai','India',19.076,72.8777]
      ].map(([name,country,lat,lng]) => ({name,country,lat,lng}));
      const status = document.getElementById('status');
      const map = L.map('map', { center:[20,0], zoom:3, zoomControl:false });
      L.control.zoom({position:'bottomleft'}).addTo(map);
      const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom:19, attribution:'© OpenStreetMap contributors © CARTO' }).addTo(map);
      const fallback = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap contributors' });
      let fallbackUsed = false;
      carto.on('tileerror', () => { if (!fallbackUsed) { fallbackUsed = true; map.removeLayer(carto); fallback.addTo(map); } });
      const clusters = L.markerClusterGroup();
      const allCities = [];
      const featuredByName = new Map(featured.map(city => [city.name.toLowerCase(), city]));

      function markerFor(city) {
        const marker = L.marker([Number(city.lat), Number(city.lng)]);
        marker.on('click', () => showCity(featuredByName.get(String(city.name).toLowerCase()) || city));
        return marker;
      }
      function showCity(city) {
        const lat = Number(city.lat ?? city.coords?.[0]);
        const lng = Number(city.lng ?? city.coords?.[1]);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
        map.flyTo([lat,lng], 10, {duration:1.2});
        document.getElementById('cityName').textContent = city.name || 'Unknown city';
        document.getElementById('cityCountry').textContent = city.country || 'Unknown country';
        document.getElementById('cityCoordinates').textContent = `📍 ${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
        document.getElementById('cityPopulation').textContent = city.population ? `👥 Population: ${Number(city.population).toLocaleString()}` : '';
        document.getElementById('facts').innerHTML = `<li>Explore ${city.name || 'this location'} by zooming in on the map.</li><li>Coordinates: ${lat.toFixed(4)}°, ${lng.toFixed(4)}°</li>`;
        document.getElementById('card').classList.add('active');
      }
      async function loadCities() {
        try {
          const response = await fetch('https://cdn.jsdelivr.net/npm/world-cities-json@1.0.1/json/cities.json');
          if (!response.ok) throw new Error(`Cities request failed: ${response.status}`);
          const cities = await response.json();
          for (const city of cities) {
            const lat = Number(city.lat), lng = Number(city.lng);
            if (city.name && Number.isFinite(lat) && Number.isFinite(lng)) { allCities.push({...city,lat,lng}); clusters.addLayer(markerFor({...city,lat,lng})); }
          }
          map.addLayer(clusters);
          status.textContent = `Loaded ${allCities.length.toLocaleString()} cities 🌍`;
          setTimeout(() => status.remove(), 3500);
        } catch (error) {
          console.error('Unable to load city data:', error);
          featured.forEach(city => clusters.addLayer(markerFor(city)));
          map.addLayer(clusters);
          status.textContent = 'Map loaded. City database unavailable; showing featured cities.';
        }
      }
      function search() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) return;
        const city = featured.find(c => c.name.toLowerCase() === query) || allCities.find(c => String(c.name).toLowerCase() === query);
        if (city) return showCity(city);
        status.textContent = 'City not found. Try another name.';
      }
      document.getElementById('searchButton').onclick = search;
      document.getElementById('searchInput').onkeydown = event => { if (event.key === 'Enter') search(); };
      document.getElementById('randomButton').onclick = () => showCity(featured[Math.floor(Math.random() * featured.length)]);
      document.getElementById('closeButton').onclick = () => document.getElementById('card').classList.remove('active');
      // Start explicitly after all dependencies and the map container are ready.
      loadCities();
    })();
  </script>
</body>
</html>
